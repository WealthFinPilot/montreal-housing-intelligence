version: 2

seeds:
  - name: apciq_sector_composition
    description: >
      Which administrative entities make up each of the 18 APCIQ sectors on the
      island. Transcribed from page 6 of the Baromètre résidentiel (APCIQ,
      2026 Q2), retrieved 2026-08-23. Verified identical in the 2019 Q2 and
      2022 Q4 editions, so the mapping needs no validity dates.

      This is a geographic nomenclature, not market data: no price, volume or
      delay is reproduced here. Source: APCIQ, by the Centris system.

    columns:
      - name: apciq_sector_number
        description: 1 to 18 on the island. APCIQ numbers 51 sectors in total.
        data_tests:
          - not_null
      - name: codemamh
        description: >
          The administrative entity this component corresponds to. Must exist
          in the city boundary file -- tested by the relationship below on the
          bridge.
        data_tests:
          - not_null
      - name: coverage
        description: >
          full = the sector contains this entity entirely.
          part = the sector contains only a piece of it.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['full', 'part']

  - name: apciq_sector_neighbourhood
    description: >
      Which APCIQ sector each of five neighbourhood polygons belongs to. Five
      rows, and no more, because only two of the 34 administrative entities are
      cut by APCIQ and this seed exists solely to cut them.

      It also names WHICH FILE is authoritative for each borough. Both
      neighbourhood files cover the whole city, so a point in Côte-des-Neiges
      also sits inside a housing-reference polygon; without borough_codemamh
      here, the wrong file would answer.

    columns:
      - name: source_dataset
        description: The file that is authoritative for this borough.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['quartiers-sociologiques', 'quartiers']
      - name: neighbourhood_code
        description: >
          The published code of the polygon. Checked against the name beside it
          by tests/assert_neighbourhood_seed_still_names_the_same_places.sql.
        data_tests:
          - not_null
      - name: borough_codemamh
        description: >
          The entity being cut. Only REM34 and REM12 appear, and they are the
          only two entities APCIQ splits.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['REM34', 'REM12']
      - name: apciq_sector_number
        description: 7, 8, 4 or 10 -- the four sectors involved in the two cuts.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [7, 8, 4, 10]
                quote: false

  - name: statcan_misplaced_representative_point
    description: >
      Dissemination areas whose published representative point cannot be where
      it landed, with the measurement that proves it.

      A declaration, not an exclusion list. Each row states the land area of the
      area itself, the room its assignment actually offers, and the ratio
      between them; tests/assert_representative_point_fits_where_it_landed.sql
      fails both on an undeclared area that no longer fits AND on a declaration
      that no longer describes anything. The second direction is the point: a
      derogation nobody re-examines is how a workaround becomes permanent.

      Two rows on the Island, out of 3 228 areas, resolved differently on
      purpose -- see the resolution column.

    columns:
      - name: da_uid
        description: The dissemination area concerned.
        data_tests:
          - not_null
          - unique
      - name: resolution
        description: >
          reassign -- the area holds residents who are being credited to a
          sector they demonstrably do not live in, so the bridge moves it.

          leave_in_place -- the area straddles the boundary just as genuinely
          but holds NO residents, so moving it would change no number while
          erasing a true geographic fact. It keeps a row of weight zero.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['reassign', 'leave_in_place']
      - name: size_ratio
        description: >
          The land area of the area divided by the room its assignment offers.
          Above 1 means it does not fit. 2.87 and 5.62 here, against a maximum
          of 1.016 for the twelve areas that merely brush a disputed shoreline.
        data_tests:
          - not_null
      - name: finding
        description: What was measured, in words, so a reader need not re-derive it.
        data_tests:
          - not_null

models:
  - name: dim_geography
    description: >
      Every geographic entity a figure can be attached to: the island, its 16
      municipalities, the 19 boroughs of Ville de Montréal, and the 18 APCIQ
      sectors. The first three nest; the sectors do not, which is why
      bridge_apciq_sector_geography exists beside this table.

      APCIQ sector rows carry no geometry on purpose -- see the model header.

    columns:
      - name: geography_key
        description: >
          Readable composite key, "type:code". Chosen over a hash so a row is
          identifiable at a glance in Power BI and in a test failure.
        data_tests:
          - not_null
          - unique

      - name: geography_type
        description: >
          island, municipality, borough, census_tract or apciq_sector.

          They do not form one clean tree. The first three nest; census tracts
          nest inside a municipality but not inside a borough, because nothing
          published says which borough a tract is in; and APCIQ sectors cut
          across boroughs entirely, which is why a bridge table exists.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['island', 'municipality', 'borough', 'census_tract',
                         'apciq_sector']

      - name: area_basis
        description: >
          What area_km2 measures, because the two families of rows do not mean
          the same thing by it.

          boundary_including_water -- the administrative outline, which runs
          into the river. The island is 619 km² this way.

          land_only -- the cartographic outline, clipped to the shoreline. The
          same island is 499 km² this way.

          NULL where area_km2 is null, i.e. the APCIQ sectors, whose geometry
          has not been built. Both figures are right about different questions,
          and adding them together is not one of those questions.
        data_tests:
          - accepted_values:
              arguments:
                values: ['boundary_including_water', 'land_only']

      - name: name
        data_tests:
          - not_null

      - name: parent_geography_key
        description: >
          NULL only for the island. Every other entity has a parent, and that
          parent must exist in this same table.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

      - name: area_km2
        description: >
          Ellipsoidal area in km². NULL for APCIQ sectors, which have no
          geometry here.

  - name: bridge_apciq_sector_geography
    description: >
      The many-to-many relationship between APCIQ sectors and administrative
      entities, with the quality of each link. Read the model header before
      using it: the duplicate rows it produces for two boroughs are the point,
      not a defect.

    columns:
      - name: apciq_geography_key
        description: Joins to dim_geography where geography_type = 'apciq_sector'.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

      - name: admin_geography_key
        description: >
          Joins to dim_geography at municipality or borough level. Never null:
          a null would mean the seed names a codemamh the city file does not
          have, which is a transcription error.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

      - name: coverage
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['full', 'part']

  - name: bridge_census_tract_apciq_sector
    description: >
      Which APCIQ sector each census tract belongs to, and in what proportion.
      This is the join the project was missing: income exists at census tract,
      price exists at APCIQ sector, and nothing published relates the two.

      543 rows for 541 tracts. One tract is genuinely shared between two sectors
      and appears twice with population weights; one more reaches into a second
      sector across land where nobody lives and carries a row of weight zero.

      HOW A TRACT REACHES A SECTOR

      Every dissemination area is placed by its published representative point,
      that point falls in one borough or linked city, and
      bridge_apciq_sector_geography says which sector that entity belongs to.
      For the two entities APCIQ cuts in half, a second point-in-polygon against
      a neighbourhood file finishes the job. No polygon is ever cut, and no
      membership is ever decided by a polygon edge.

      WHAT IS ASSUMED RATHER THAN OBSERVED

      APCIQ publishes no line between its sector 7 (NDG) and its sector 8
      (Côte-des-Neiges) -- only the two names. The 2014 sociological boundary of
      Ville de Montréal stands in for it, over 40 tracts and 170 583 people.
      assignment_method carries that distinction on every row.

    columns:
      - name: census_tract_geography_key
        description: Joins to dim_geography.geography_key at census_tract level.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

      - name: apciq_geography_key
        description: Joins to dim_geography.geography_key at apciq_sector level.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

      - name: ct_uid
        description: >
          Census tract identifier. NOT unique here: a shared tract carries one
          row per sector, deliberately, so a consumer sees the ambiguity instead
          of a single wrong number.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_statcan__census_tracts')
                field: ct_uid

      - name: apciq_sector_number
        description: 1 to 18. All eighteen are reached.
        data_tests:
          - not_null

      - name: population_weight
        description: >
          The share of the tract this row accounts for. Sums to exactly 1 per
          tract -- asserted by
          tests/assert_tract_weights_account_for_the_whole_tract.sql.
        data_tests:
          - not_null

      - name: weight_basis
        description: >
          population -- the normal case.

          dissemination_area_count -- the 7 tracts with no residents at all,
          which have no population to weight. Each holds one area, so each gets
          a single row at 1.0.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['population', 'dissemination_area_count']

      - name: assignment_method
        description: >
          borough_code -- the published code of the entity settled the sector on
          its own. An observation.

          neighbourhood_polygon -- a neighbourhood boundary stood in for a line
          APCIQ does not publish. A DERIVED assumption, and the only reason this
          column exists.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['borough_code', 'neighbourhood_polygon']

      - name: tract_is_shared
        description: >
          True where the RESIDENTS of the tract are split across two sectors.
          Counted on rows carrying population, not on rows that merely exist, so
          a reach into empty land is not dressed up as an ambiguity households
          face.
        data_tests:
          - not_null

      - name: includes_corrected_point
        description: >
          True where a declared misplacement moved the area of this row off the
          side its point had landed on. One tract carries it -- see the seed
          statcan_misplaced_representative_point.
        data_tests:
          - not_null

  - name: dim_property_type
    description: >
      The three property categories APCIQ reports on: single-family, condo,
      plex. Declared rather than derived from the fact, so that the
      relationship test between the two proves something -- and checked against
      the printed labels by assert_property_types_still_match_the_source.sql.

      These are APCIQ's categories, not a classification of this project's own.
      A plex here is a building of 2 to 5 dwellings, as the source label says.

    columns:
      - name: property_type_code
        description: The join key. single_family, condo or plex.
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['single_family', 'condo', 'plex']
      - name: source_label_fr
        description: >
          The label as APCIQ prints it in Tableau 2. Kept so a figure stays
          traceable to its page, and compared against the source by a test --
          the wording of these rows has changed before.
        data_tests:
          - not_null
          - unique
      - name: sort_order
        description: The order the categories appear in on the page.
        data_tests:
          - not_null
          - unique

  - name: dim_date
    description: >
      One row per day from 2015-01-01 to 31 December of the current year. One
      date table for the whole model: the market facts join on their quarter,
      the Bank of Canada observations on their own date. Two date tables in one
      Power BI model is how a report ends up with two slicers that disagree.

      Contiguity is required for Power BI to accept it as a date table, and is
      tested by assert_dim_date_has_no_gap.sql, which also checks that no fact
      falls outside the range.

    columns:
      - name: date_key
        description: The day. Join key for every fact in the project.
        data_tests:
          - not_null
          - unique
      - name: quarter_start_date
        description: >
          First day of the quarter this day belongs to. This is what
          fact_market joins on.
        data_tests:
          - not_null
      - name: quarter_label
        description: '"2026 Q2" -- spelled the way APCIQ editions are labelled.'
        data_tests:
          - not_null
      - name: calendar_year
        data_tests:
          - not_null

  - name: fact_market
    description: >
      The realised market, one row per quarter x geography x property type.
      1 653 rows: 29 quarters x 19 geographies x 3 categories, a full grid
      because the source prints a full grid.

      READ THE HEADER OF fact_market.sql BEFORE USING IT. Three things it
      records that a naive aggregation gets wrong: active listings never add up
      across time, the island row is a total and not a nineteenth sector, and
      the figures are the vintage APCIQ first published -- summing four
      quarters does not reproduce its own 12-month figure.

      Source: APCIQ, by the Centris system. These figures may not be
      redistributed.

    columns:
      - name: market_key
        description: >
          quarter, geography and category in one column, so that the grain can
          be asserted with a built-in test rather than by adding a package for
          one assertion. Power BI does not use it -- its relationships are
          single-column and it joins on the three keys separately.
        data_tests:
          - not_null
          - unique
      - name: quarter_start_date
        description: First day of the quarter the figures describe.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: geography_key
        description: The island or one of the 18 APCIQ sectors.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: property_type_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_property_type')
                field: property_type_code
      - name: is_island_aggregate
        description: >
          True on the island row, which is the total of the other eighteen.
          Summing across the table without filtering on this counts the island
          twice.
        data_tests:
          - not_null
      - name: sales_count
        description: >
          Sales concluded in the quarter, counted at the acceptance of the
          promise to purchase and not at the notarial deed. Adds up across
          geographies and across time.
      - name: active_listings
        description: >
          « La moyenne des données mensuelles pour la période visée » -- an
          average of month-end counts. ADDS UP ACROSS GEOGRAPHIES AND NEVER
          ACROSS TIME. A measure that sums four quarters of this is wrong.
      - name: median_price
        description: >
          « Valeur médiane des ventes effectuées ». A SALE price: not an asking
          price, not a municipal assessment. Medians do not aggregate -- the
          island figure is published, never computed from the sectors.
      - name: days_on_market
        description: Average days on market, as published.
      - name: median_price_change_pct_yoy
        description: >
          Year over year, « par rapport au même trimestre de l'année
          précédente », as APCIQ prints it. Published rather than recomputed:
          our own arithmetic would use first-vintage figures and would not
          agree.

      - name: sales_value_status
        description: >
          Why the figure is what it is, and there are four answers.

          published -- a figure.

          withheld -- APCIQ printed two asterisks: « Nombre de transactions
          insuffisant pour produire une statistique fiable ». The market
          exists, the statistic is not reliable enough to print.

          nothing_to_report -- a dash. There is none of this here, as with plex
          on L'Île-des-Sœurs, which has none at all.

          not_printed -- nothing appeared on the page. Seen only on
          days-on-market rows of the 2019 template.

          A withheld price and an absent price are different facts about the
          market, and a dashboard showing both as a blank has lost the
          difference.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['published', 'withheld', 'nothing_to_report', 'not_printed']

      - name: active_listings_value_status
        description: See sales_value_status for the four states.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['published', 'withheld', 'nothing_to_report', 'not_printed']

      - name: median_price_value_status
        description: >
          See sales_value_status. This is where withheld actually bites: 430 of
          the 1 653 quarterly median prices are withheld, 251 of them on plex.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['published', 'withheld', 'nothing_to_report', 'not_printed']

      - name: average_price_value_status
        description: See sales_value_status for the four states.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['published', 'withheld', 'nothing_to_report', 'not_printed']

      - name: days_on_market_value_status
        description: >
          See sales_value_status. The only column where not_printed occurs --
          25 cells of the 2019-era template.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['published', 'withheld', 'nothing_to_report', 'not_printed']

      - name: sales_corroboration
        description: >
          What the two J3.2 controls say about this row. corroborated -- both
          reconciled. contradicted_on_its_page -- the page disagrees with
          itself, so its reading is not settled. not_reconciled_across_pages --
          the page is coherent but the 18 sectors do not match the island for
          this edition and category.

          not_null is deliberate: a NULL here would mean a control that used to
          run has vanished, and accepted_values would let it through.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['corroborated', 'contradicted_on_its_page', 'not_reconciled_across_pages']

      - name: active_listings_corroboration
        description: >
          As sales_corroboration. This is the column that carries the three
          quarters with no usable inventory -- 2021 Q4, 2022 Q1, 2022 Q2 -- and
          it carries them rather than hiding them.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['corroborated', 'contradicted_on_its_page', 'not_reconciled_across_pages']

      - name: source_page
        description: The page of the edition every figure on this row was read from.
        data_tests:
          - not_null

  - name: fact_market_trailing_12m
    description: >
      The same market over the twelve months ending with each quarter. 1 653
      rows again, and a SEPARATE TABLE from fact_market on purpose: consecutive
      rows overlap by nine months, so summing four of them counts most sales
      four times. Two tables make that impossible rather than detectable.

      It is not a rolling sum of fact_market and cannot be derived from it. A
      twelve-month median is not the average of four quarterly medians, and on
      the counts APCIQ's own 12-month total sits below the sum of its four
      quarters -- 78 times out of 78 on the island. It also carries 341 median
      prices that the quarterly table withholds, almost all of them plex and
      small sectors.

      Source: APCIQ, by the Centris system. These figures may not be
      redistributed.

    columns:
      - name: trailing_key
        data_tests:
          - not_null
          - unique
      - name: period_end_date
        description: >
          Last day of the twelve-month window, which is also the last day of
          the edition's own quarter. This is the date to plot on.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: period_start_date
        description: >
          First day of the window -- nine months before the previous row's end.
          That overlap is the whole reason this table is separate.
        data_tests:
          - not_null
      - name: geography_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key
      - name: property_type_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_property_type')
                field: property_type_code
      - name: is_island_aggregate
        data_tests:
          - not_null

      - name: sales_value_status
        description: The four states, as in fact_market.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['published', 'withheld', 'nothing_to_report', 'not_printed']

      - name: active_listings_value_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['published', 'withheld', 'nothing_to_report', 'not_printed']

      - name: median_price_value_status
        description: >
          The reason this table exists. 341 of the 430 prices withheld on the
          quarterly table are published here, the twelve-month sample being
          four times larger.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['published', 'withheld', 'nothing_to_report', 'not_printed']

      - name: average_price_value_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['published', 'withheld', 'nothing_to_report', 'not_printed']

      - name: days_on_market_value_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['published', 'withheld', 'nothing_to_report', 'not_printed']

      - name: sales_corroboration
        description: >
          As in fact_market, plus a fourth verdict this period needs:
          not_controlled_at_ingestion, where the parser recorded no verdict at
          all. It is not a synonym for "fine" -- the check was never run, which
          is a different statement from "the check ran and passed". Every row
          of this column is in that state, because SECTOR_CONTROLLED in
          parse.py never covered 12-month sales, and
          assert_trailing_sales_reconcile_to_the_island.sql is what covers it
          in the meantime.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['corroborated', 'not_reconciled_across_pages', 'not_controlled_at_ingestion']

      - name: active_listings_corroboration
        description: >
          This one does have stored verdicts: ('active_listings',
          'trailing_12m') is in SECTOR_CONTROLLED.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['corroborated', 'not_reconciled_across_pages', 'not_controlled_at_ingestion']

  - name: dim_household_profile
    description: >
      The three household profiles the affordability model reports on, declared
      rather than derived. The census publishes 77 size x type combinations per
      tract; these three are the ones a first-time buyer can be, and all three
      are published for 530 of the island's 541 tracts.
    columns:
      - name: household_profile_code
        description: Stable code used as the grain key downstream.
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['total', 'one_person', 'couple']

      - name: household_size_label
        description: >
          The size label exactly as Statistics Canada prints it. Compared
          against the source by
          assert_household_profiles_still_match_the_source.sql, so a relabelled
          dimension in a future census fails the build instead of silently
          producing three empty profiles.
        data_tests:
          - not_null
          - unique

      - name: household_type_label
        description: The type label, verbatim, en dash included.
        data_tests:
          - not_null
          - unique

  - name: fact_mortgage_scenario
    description: >
      What it costs to buy the median property, before asking who is buying.
      One row per quarter x geography x property type, 1 653 of them, the same
      grain as fact_market. Every figure is DERIVED from two observed inputs
      (the APCIQ price and the Bank of Canada contracted rate) and from
      published rules held in three seeds.
    columns:
      - name: mortgage_scenario_key
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fact_market')
                field: market_key

      - name: median_price
        description: >
          Carried from fact_market unchanged. Null on the 430 sector-quarter
          combinations APCIQ withheld.

      - name: contract_rate_percent
        description: >
          The quarterly mean of FVI_MTG_RATE_5Y_FIX, the 5-year fixed rate
          actually CONTRACTED on a high-ratio mortgage. Never the posted rate.
        data_tests:
          - not_null

      - name: posted_rate_percent
        description: >
          The quarterly mean of V80691335, the ADVERTISED 5-year rate, carried
          only so the gap between the two is a column rather than a caveat.
        data_tests:
          - not_null

      - name: rate_basis
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['contracted_high_ratio_5y_fixed']

      - name: qualifying_rate_percent
        description: >
          The greater of the contract rate plus two points and 5.25 per cent,
          as CMHC states it. Computed on the contract rate, never on the posted
          one, which would apply the buffer twice.
        data_tests:
          - not_null

      - name: income_required_basis
        description: >
          Says what the required income does and does not include. It is a
          LOWER BOUND: gross debt service also counts property tax, heating and
          half of any condo fees, none of which this project holds.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['mortgage_payment_only_at_gds_39']

      - name: insurance_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['insured', 'uninsured', 'not_insurable', 'no_price_published']

  - name: fact_affordability
    description: >
      Can this household buy in this tract, and how far off is it. One row per
      quarter x census tract x property type x household profile. The sector
      price is carried DOWN to each tract; tract incomes are never averaged up
      into a sector income, which would be a median of medians.
    columns:
      - name: affordability_key
        data_tests:
          - not_null
          - unique

      - name: ct_uid
        data_tests:
          - not_null

      - name: property_type_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_property_type')
                field: property_type_code

      - name: household_profile_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_household_profile')
                field: household_profile_code

      - name: census_tract_geography_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

      - name: price_basis
        description: >
          The single assumption this table rests on, carried on every row so a
          reader who rejects it can filter the whole table out at once.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['apciq_sector_price_applied_to_tract']

      - name: income_year
        description: >
          2020 on every row. The price runs to 2026, and
          price_year_minus_income_year states the gap rather than hiding it.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2020]

      - name: household_income_status
        description: >
          published, suppressed or not_applicable. Null only where the profile
          row is absent from the census file altogether.
        data_tests:
          - accepted_values:
              arguments:
                values: ['published', 'suppressed', 'not_applicable']

      - name: assignment_method
        description: >
          How the tract was placed in its APCIQ sector. neighbourhood_polygon
          marks the 40 tracts placed by the City's 2014 sociological line
          between Cote-des-Neiges and NDG, which APCIQ does not publish -- the
          largest single assumption in the geography.
        data_tests:
          - not_null

version: 2

# Source and models in one file, the convention this repo already follows for
# Données Montréal. Freshness is measured on first_seen_at, not updated_at:
# updated_at only moves when APCIQ revises a figure, so a stable quarter would
# look stale. The Baromètre is quarterly, so a warning at 200 days means one
# publication has been missed.

sources:
  - name: apciq
    schema: raw
    description: >
      APCIQ Baromètre résidentiel (Montréal edition), read positionally from
      the quarterly PDF. Source : APCIQ par le système Centris. Reproduction
      of these figures is forbidden without written consent, so nothing built
      on this source may be published.
    tables:
      - name: apciq_barometer_statistic
        description: >
          One row per cell of Tableau 2. 855 rows per edition: 19 areas
          x 3 property categories x 5 metrics x 3 periods.
        loaded_at_field: first_seen_at
        freshness:
          warn_after: {count: 200, period: day}
          error_after: {count: 400, period: day}

      - name: apciq_control_total
        description: >
          The verdict of every reconciliation run while reading an edition:
          47 rows per edition. Loaded in the same transaction as the figures
          it judges, so the database can never hold one without the other.
        loaded_at_field: first_seen_at
        freshness:
          warn_after: {count: 200, period: day}
          error_after: {count: 400, period: day}

models:
  - name: stg_apciq__barometer_statistics
    description: >
      APCIQ figures typed and dated. Long format, one row per published cell;
      the pivot into fact_market belongs to the mart layer. Rows with
      period_code = 'trailing_12m' overlap between editions by construction
      and must never be summed.
    columns:
      - name: geography_key
        description: Joins marts.dim_geography. 'island:mtl' or 'apciq_sector:N'.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_geography')
                field: geography_key

      - name: property_category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['single_family', 'condo', 'plex']

      - name: metric_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - sales
                  - active_listings
                  - median_price
                  - average_price
                  - days_on_market

      - name: period_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['quarter', 'trailing_12m', 'five_year']

      - name: unit
        description: >
          What value_numeric is measured in. A long table mixes counts,
          dollars and days in one column; this says which is which.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['count', 'cad', 'days']

      - name: edition_quarter
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false

      - name: is_withheld_by_source
        description: >
          True where APCIQ printed '**' -- « Nombre de transactions
          insuffisant pour produire une statistique fiable ». The market
          exists; the statistic was judged unreliable. Not the same as a
          missing value, and downstream models must not treat it as one.
        tests:
          - not_null

      - name: is_nothing_to_report
        description: >
          True where APCIQ printed a dash. On a count row that means zero --
          L'Île-des-Sœurs has no plex at all. On a price row it means there
          was nothing to price.
        tests:
          - not_null

  - name: stg_apciq__control_totals
    description: >
      One row per control run on an APCIQ edition: what the source printed as
      a total, what its own parts add up to, and whether the two reconcile
      within what rounding can explain. The model that lets a query answer
      "does the source corroborate this figure", instead of that answer living
      in a commit message.
    columns:
      - name: control_code
        description: >
          page_table1_vs_table2 asks whether WE read a page correctly, by
          comparing two totals printed side by side on it. sectors_vs_island
          asks whether APCIQ is coherent from one page to the next. They are
          not interchangeable: when the first passes on sales and fails on
          listings for the same page, the columns are demonstrably right and
          the contradiction belongs to the publisher.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['page_table1_vs_table2', 'sectors_vs_island']

      - name: metric_code
        description: >
          Only counts can be reconciled by addition. Prices and days on market
          are medians and averages -- eighteen of them do not add up to a
          nineteenth -- so no control exists for them and none is implied.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['sales', 'active_listings']

      - name: property_category
        description: >
          'all' on the on-page control, because Tableau 1 publishes only a
          combined total.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['single_family', 'condo', 'plex', 'all']

      - name: is_reconciled
        description: >
          False does not mean the figure is wrong. It means the source does
          not corroborate it -- a weaker and more honest claim. What it must
          never be is invisible downstream.
        tests:
          - not_null

      - name: tolerance
        description: >
          Zero on sales: a sum of counts has nothing to round. On active
          listings it absorbs rounding and nothing else, since each figure is
          an average rounded once -- at most 2 for three categories against
          one page total, at most 9 for eighteen sectors against the island.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 2, 9]
                quote: false

      - name: published_total
        tests:
          - not_null

      - name: computed_total
        tests:
          - not_null

seeds:
  - name: apciq_known_publisher_defect
    description: >
      The APCIQ defects investigated, verified and accepted, one row per
      edition x control x metric. Not a list of things to ignore: it is what
      makes a NEW defect visible, since
      assert_apciq_controls_hold_or_are_accounted_for fails both on a failure
      nobody declared and on a declaration that no longer matches anything.
    columns:
      - name: edition_year
        tests:
          - not_null
      - name: control_code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['page_table1_vs_table2', 'sectors_vs_island']
      - name: metric_code
        tests:
          - not_null
      - name: finding
        description: What was actually observed, in one line, at the date verified.
        tests:
          - not_null

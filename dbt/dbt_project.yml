# ---------------------------------------------------------------------------
# Montreal Housing Intelligence -- dbt project
#
# dbt does exactly one thing here: it sends SQL to PostgreSQL in dependency
# order and checks the result. It fetches nothing and stores nothing itself.
#
# Run it through the wrapper, which loads .env and checks the tunnel:
#     bash scripts/dbt.sh run
#     bash scripts/dbt.sh test
# ---------------------------------------------------------------------------

name: 'mhi'
version: '0.1.0'
config-version: 2

# Which connection block to use, defined in dbt/profiles.yml.
profile: 'mhi'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"

flags:
  # This is a personal portfolio project. No telemetry.
  send_anonymous_usage_stats: false

models:
  mhi:
    staging:
      # A view, not a table: 3629 rows recomputed on read cost nothing, and a
      # view can never hold a stale copy of the raw layer.
      +materialized: view
      # Lands in the schema named "staging" exactly -- see
      # macros/generate_schema_name.sql for why that needs an override.
      +schema: staging

    intermediate:
      # The layer section 35 of the brief provides for, opened here for the
      # first time. It holds one model: a calculation that is neither a
      # cleaned copy of a source (staging) nor something Power BI reads
      # (marts) -- the quarterly price index factor.
      #
      # A view, and deliberately in the STAGING schema rather than a fourth
      # one of its own. Giving it a schema would mean a migration, a grant and
      # a line in every tool's search path, for a single model nothing outside
      # dbt reads.
      +materialized: view
      +schema: staging

    marts:
      # A table, unlike staging. Two reasons, and neither is performance at
      # this size: Power BI imports these, and an imported view that silently
      # changes shape between refreshes is harder to reason about than a table
      # rebuilt on a known command. Geometry unions are also computed once here
      # rather than on every read.
      +materialized: table
      +schema: marts

seeds:
  mhi:
    +schema: marts
    apciq_sector_composition:
      # Types stated rather than inferred. codemamh above all must stay text:
      # half its values are REMxx and half are five digits, and letting the
      # loader guess would turn 66007 into a number in one file and a string in
      # the next, breaking the join to the boundaries silently.
      +column_types:
        apciq_sector_number: integer
        apciq_sector_name: text
        component_label_source: text
        codemamh: text
        coverage: text

    apciq_known_publisher_defect:
      # The year and quarter must be integers, because they join to integer
      # columns coming out of the raw layer. Left to inference they would load
      # as bigint on one machine and integer on another, and the join would
      # still work -- until it silently did not.
      +column_types:
        edition_year: integer
        edition_quarter: integer
        control_code: text
        metric_code: text
        verified_on: date
        finding: text

    apciq_sector_neighbourhood:
      # neighbourhood_code must stay text. The sociological file numbers 1..32
      # and the housing-reference one uses '60A', '60B', '60C' -- inference
      # would load one as integer and the other as text, and the join to
      # raw.mtl_neighbourhood would then fail on exactly the rows that matter.
      +column_types:
        source_dataset: text
        neighbourhood_code: text
        neighbourhood_name_source: text
        borough_codemamh: text
        apciq_sector_number: integer

    mortgage_down_payment_bracket:
      # Every money column is numeric and never float. These figures decide a
      # down payment to the dollar, and a binary float would make the boundary
      # at exactly $500,000 fall on whichever side the rounding chose.
      # price_to_cad and tranche_to_cad are deliberately empty on the top
      # bracket: it has no ceiling, and writing one would invent a limit the
      # source does not state.
      +column_types:
        rule_id: text
        price_from_cad: numeric
        price_to_cad: numeric
        tranche_from_cad: numeric
        tranche_to_cad: numeric
        down_payment_rate: numeric
        source_url: text
        retrieved_on: date
        published_wording: text

    mortgage_insurance_premium_band:
      # value_basis is the column that keeps this seed honest. The 25-year
      # bands are published band by band. The 30-year ones are not: CMHC
      # publishes only the range 3.00% to 4.70% for Home Start, so the two
      # endpoints are 'published_range_endpoint' and the two middle bands are
      # 'derived_from_endpoint_surcharge' -- both endpoints sit exactly 0.20
      # above their 25-year band, and the same 0.20 is carried to the middle
      # two. That is a derived value, and section 41.2 of the brief requires
      # it to say so rather than pass for an observation.
      +column_types:
        amortization_years: integer
        ltv_from: numeric
        ltv_to: numeric
        down_payment_kind: text
        premium_rate: numeric
        value_basis: text
        source_url: text
        retrieved_on: date

    mortgage_underwriting_parameter:
      # parameter_value stays numeric across rows that mean percent, dollars,
      # years and one boolean. The unit column is what tells them apart, and
      # any model reading this seed must filter on parameter_name and read
      # unit -- never assume the scale.
      # value_basis separates a published requirement from a stated assumption.
      # Eleven rows are 'published'. One is 'market_convention': the Interest
      # Act permits a rate stated yearly OR half-yearly, so half-yearly
      # compounding is market practice rather than law, and every payment in
      # fact_mortgage_scenario depends on it.
      +column_types:
        parameter_name: text
        parameter_value: numeric
        unit: text
        applies_to: text
        value_basis: text
        source_url: text
        retrieved_on: date
        published_wording: text

    statcan_misplaced_representative_point:
      # The areas are numeric, not float: they are compared against a measured
      # PostGIS area and the comparison must be exact about what it stated, not
      # about what a binary float rounded it to.
      +column_types:
        da_uid: text
        ct_uid: text
        point_falls_in_codemamh: text
        tract_mostly_in_codemamh: text
        tract_share_of_majority_pct: numeric
        da_land_area_km2: numeric
        room_in_assignment_km2: numeric
        size_ratio: numeric
        population_2021: integer
        resolution: text
        verified_on: date
        finding: text

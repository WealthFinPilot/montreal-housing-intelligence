# ---------------------------------------------------------------------------
# Montreal Housing Intelligence -- dbt project
#
# dbt does exactly one thing here: it sends SQL to PostgreSQL in dependency
# order and checks the result. It fetches nothing and stores nothing itself.
#
# Run it through the wrapper, which loads .env and checks the tunnel:
#     bash scripts/dbt.sh run
#     bash scripts/dbt.sh test
# ---------------------------------------------------------------------------

name: 'mhi'
version: '0.1.0'
config-version: 2

# Which connection block to use, defined in dbt/profiles.yml.
profile: 'mhi'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets:
  - "target"
  - "dbt_packages"

flags:
  # This is a personal portfolio project. No telemetry.
  send_anonymous_usage_stats: false

models:
  mhi:
    staging:
      # A view, not a table: 3629 rows recomputed on read cost nothing, and a
      # view can never hold a stale copy of the raw layer.
      +materialized: view
      # Lands in the schema named "staging" exactly -- see
      # macros/generate_schema_name.sql for why that needs an override.
      +schema: staging

    marts:
      # A table, unlike staging. Two reasons, and neither is performance at
      # this size: Power BI imports these, and an imported view that silently
      # changes shape between refreshes is harder to reason about than a table
      # rebuilt on a known command. Geometry unions are also computed once here
      # rather than on every read.
      +materialized: table
      +schema: marts

seeds:
  mhi:
    +schema: marts
    apciq_sector_composition:
      # Types stated rather than inferred. codemamh above all must stay text:
      # half its values are REMxx and half are five digits, and letting the
      # loader guess would turn 66007 into a number in one file and a string in
      # the next, breaking the join to the boundaries silently.
      +column_types:
        apciq_sector_number: integer
        apciq_sector_name: text
        component_label_source: text
        codemamh: text
        coverage: text

    apciq_known_publisher_defect:
      # The year and quarter must be integers, because they join to integer
      # columns coming out of the raw layer. Left to inference they would load
      # as bigint on one machine and integer on another, and the join would
      # still work -- until it silently did not.
      +column_types:
        edition_year: integer
        edition_quarter: integer
        control_code: text
        metric_code: text
        verified_on: date
        finding: text

    apciq_sector_neighbourhood:
      # neighbourhood_code must stay text. The sociological file numbers 1..32
      # and the housing-reference one uses '60A', '60B', '60C' -- inference
      # would load one as integer and the other as text, and the join to
      # raw.mtl_neighbourhood would then fail on exactly the rows that matter.
      +column_types:
        source_dataset: text
        neighbourhood_code: text
        neighbourhood_name_source: text
        borough_codemamh: text
        apciq_sector_number: integer

    statcan_misplaced_representative_point:
      # The areas are numeric, not float: they are compared against a measured
      # PostGIS area and the comparison must be exact about what it stated, not
      # about what a binary float rounded it to.
      +column_types:
        da_uid: text
        ct_uid: text
        point_falls_in_codemamh: text
        tract_mostly_in_codemamh: text
        tract_share_of_majority_pct: numeric
        da_land_area_km2: numeric
        room_in_assignment_km2: numeric
        size_ratio: numeric
        population_2021: integer
        resolution: text
        verified_on: date
        finding: text
